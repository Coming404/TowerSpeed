name: iOS Build

on:
  push:
    branches: [main]
    tags: ['release/**']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.6'
  FLUTTER_CHANNEL: 'stable'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib || true
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

  ios-unsigned:
    name: iOS IPA (unsigned)
    runs-on: macos-14
    # 非 release tag 才跑（release 走 ios-signed）
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/release/')
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Regenerate iOS project (pbxproj template via flutter create)
        run: |
          # 先备份我们定制的文件
          cp ios/Runner/Info.plist /tmp/Info.plist
          cp ios/Podfile /tmp/Podfile
          cp ios/ExportOptions.plist /tmp/ExportOptions.plist
          cp -r ios/Runner/Assets.xcassets /tmp/Assets.xcassets

          # 让 flutter 重新生成 ios/（pbxproj 等所有工程文件）
          rm -rf ios
          flutter create --org com.towerspeed --project-name tower_speed --platforms ios .

          # 覆盖回定制文件
          cp /tmp/Info.plist ios/Runner/Info.plist
          cp /tmp/Podfile ios/Podfile
          cp /tmp/ExportOptions.plist ios/ExportOptions.plist
          rm -rf ios/Runner/Assets.xcassets
          cp -r /tmp/Assets.xcassets ios/Runner/Assets.xcassets

      - run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned .app
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -q TowerSpeed-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TowerSpeed-unsigned-ipa
          path: TowerSpeed-unsigned.ipa
          retention-days: 14

  ios-signed:
    name: iOS IPA (signed, TestFlight-ready)
    runs-on: macos-14
    if: startsWith(github.ref, 'refs/tags/release/')
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Regenerate iOS project
        run: |
          cp ios/Runner/Info.plist /tmp/Info.plist
          cp ios/Podfile /tmp/Podfile
          cp ios/ExportOptions.plist /tmp/ExportOptions.plist
          cp -r ios/Runner/Assets.xcassets /tmp/Assets.xcassets
          rm -rf ios
          flutter create --org com.towerspeed --project-name tower_speed --platforms ios .
          cp /tmp/Info.plist ios/Runner/Info.plist
          cp /tmp/Podfile ios/Podfile
          cp /tmp/ExportOptions.plist ios/ExportOptions.plist
          rm -rf ios/Runner/Assets.xcassets
          cp -r /tmp/Assets.xcassets ios/Runner/Assets.xcassets

      - run: flutter pub get

      - name: Install Apple certificate & provisioning profile
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo -n "$IOS_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$CERT_PATH" -k build.keychain \
            -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build & export IPA
        env:
          EXPORT_OPTIONS_PLIST: ${{ secrets.EXPORT_OPTIONS_PLIST }}
        run: |
          echo "$EXPORT_OPTIONS_PLIST" > /tmp/ExportOptions.plist
          flutter build ipa --release \
            --export-options-plist=/tmp/ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TowerSpeed-release-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 30

      - name: Upload to TestFlight (optional)
        if: env.ASC_KEY_ID != ''
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo -n "$ASC_KEY_BASE64" | base64 --decode -o "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          xcrun altool --upload-app --type ios -f "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            --apiKeyFileDir "$RUNNER_TEMP/keys"
